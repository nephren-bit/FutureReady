<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FutureReady - Luyện tập thuyết trình & phỏng vấn cùng AI</title>
    <meta name="description" content="Tự luyện thuyết trình và phỏng vấn trước webcam. Máy đo chỉ số chuyển động và phát hiện sự kiện trên dòng thời gian -- không chấm điểm tổng." />
    <script>
      // Set data-theme before React mounts, from the same localStorage key
      // ThemeContext.tsx reads/writes -- otherwise the page paints once in
      // the wrong theme and flashes to the right one a moment later.
      (function () {
        try {
          var stored = localStorage.getItem('futureready-theme')
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored)
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
