# Hồ sơ bối cảnh: cá nhân tự luyện thuyết trình trước webcam.
#
# NGƯỠNG DƯỚI ĐÂY LÀ ĐIỂM KHỞI ĐẦU, CHƯA PHẢI HIỆU CHỈNH THẬT.
#
# Toàn bộ khối `events` chuyển nguyên từ `presentation_class.yaml` (hồ sơ lớp
# học cũ, đã hiệu chỉnh trên bối cảnh đứng xa camera) — dùng tạm vì cùng bộ
# chỉ số/sự kiện, đỡ phải bắt đầu từ số 0. Đây KHÔNG phải ngưỡng đã kiểm
# chứng cho bối cảnh ngồi gần webcam; Task 9 (đo độ chính xác trên 10 bản ghi
# `presentation_solo` thật, dùng `PeerNote` làm dữ liệu đối chứng) bắt buộc
# phải chạy trước khi tin số liệu này. Tăng `version` sau khi hiệu chỉnh lại.
#
# Khác biệt đã biết so với presentation_class, cần theo dõi khi hiệu chỉnh:
# người dùng thường ngồi và khung hình cắt ngang ngực, nên nhóm `hips` thường
# không nhìn thấy — các chỉ số dựa trên hông sẽ trả về `không đo được`, đúng
# như thiết kế (xem `analyzers/landmark_availability.py`), chứ không trả về 0.
# Ngưỡng thời lượng tối thiểu (`min_duration_sec`) copy nguyên từ bối cảnh
# đứng xa nên nhiều khả năng cần điều chỉnh khi có dữ liệu ngồi gần thật.
#
# Khác một chỗ so với presentation_class: mọi sự kiện ở đây báo khung hình
# bắt đầu sự kiện (`report.value: frame`) thay vì chỉ báo thời lượng.
# E_STATIC/E_PACING/E_TURNED_AWAY đổi trước (thay tỷ lệ chuẩn hoá gốc "lần
# rộng vai mỗi giây", "lần mức tham chiếu" bằng số nguyên dễ định vị hơn).
# E_HEAD_DOWN/E_CLOSED_POSTURE/E_STABLE_SEGMENT đổi sau, vì lý do khác: nhãn
# cũ kiểu "Đoạn X giây ... dải tốt" đọc như đang chấm cả một quãng là
# tốt/xấu, trong khi dải mốc xem lại (VideoTimeline.tsx) chỉ đánh dấu MỘT
# ĐIỂM — nhãn phải khớp với đó, tức "tại khung hình này, X xảy ra (kéo dài Y
# giây)", không phải "đoạn này là X". Vẫn giữ nguyên `{duration}` trong nhãn
# và trong `PresentationEvent.duration_sec` — chỉ đổi cách diễn đạt và neo
# thêm một mốc bắt đầu, không đổi thuật toán phát hiện hay bỏ dữ liệu thời
# lượng (bảng theo dõi chất lượng vẫn cần nó).
# `presentation_class.yaml` (hồ sơ lớp học cũ) giữ nguyên kiểu báo cáo gốc,
# không đổi theo.

profile: presentation_solo
version: "0.1.0"
description: >-
  Người dùng tự ghi trước webcam. Camera gần, khung hình thường cắt ngang ngực.

frame_requirements:
  min_pose_detected_ratio: 0.5
  min_landmark_visibility: 0.5
  min_group_frame_ratio: 0.6
  min_sample_rate_hz: 1.0

# Tập chỉ số áp dụng. Giữ nguyên `required_landmark_groups` như hồ sơ lớp học:
# đây là ràng buộc hình học, không phải ngưỡng, nên không cần chờ hiệu chỉnh.
metrics:
  head_up_ratio:
    unit: "tỷ lệ 0-1"
    required_landmark_groups: [head, shoulders]
    params:
      head_up_margin_ratio: 0.35
      # Phương án dự phòng khi Pose không đo được: chỉ dùng head pose của Face
      # Mesh khi phát hiện được mặt rõ trong ít nhất tỷ lệ khung hình này.
      facemesh_fallback_min_faces_ratio: 0.6

  postural_sway:
    unit: "lần rộng vai"
    required_landmark_groups: [shoulders, hips]
    params: {}

  movement_range:
    unit: "lần rộng vai"
    required_landmark_groups: [shoulders, hips]
    params: {}

  gesture_rate:
    unit: "lần/phút"
    required_landmark_groups: [shoulders, hips, upper_body]
    params:
      gesture_elevation_ratio: 0.35
      gesture_lateral_ratio: 0.45

  closed_posture_ratio:
    unit: "tỷ lệ 0-1"
    required_landmark_groups: [shoulders, hips, upper_body]
    params:
      low_wrist_elevation_ratio: 0.05
      crossed_wrist_overlap_ratio: 0.10

  shoulder_tilt:
    unit: "độ"
    required_landmark_groups: [shoulders]
    params: {}

  turned_away_ratio:
    unit: "tỷ lệ 0-1"
    required_landmark_groups: [shoulders]
    params:
      turned_width_ratio: 0.62

# Danh mục sự kiện đã khai báo.
event_catalog:
  - E_HEAD_DOWN
  - E_STATIC
  - E_PACING
  - E_TURNED_AWAY
  - E_CLOSED_POSTURE
  - E_STABLE_SEGMENT

# ---------------------------------------------------------------------------
# Bộ ngưỡng — chuyển nguyên từ presentation_class, CHƯA hiệu chỉnh cho bối
# cảnh ngồi gần webcam. Xem ghi chú đầu file.
# ---------------------------------------------------------------------------
events:
  E_HEAD_DOWN:
    requires_metrics: [head_up_ratio]
    conditions:
      - signal: head_up
        comparison: below
        threshold: 0.5
    min_duration_sec: 4.0
    merge_gap_sec: 2.0
    report:
      value: frame
      unit: "khung hình"
    label_template: "Cúi mặt liên tục {duration} giây (bắt đầu ở khung hình {value})"

  E_STATIC:
    requires_metrics: [postural_sway, movement_range]
    conditions:
      - signal: motion_rate
        comparison: at_most
        threshold: 0.04
    min_duration_sec: 25.0
    merge_gap_sec: 2.0
    # value: frame -- báo khung hình bắt đầu sự kiện thay vì tỷ lệ chuẩn hoá
    # "lần rộng vai mỗi giây": số nguyên dễ định vị hơn số thập phân kỹ thuật.
    report:
      value: frame
      unit: "khung hình"
    label_template: "Không dịch chuyển trong {duration} giây (bắt đầu ở khung hình {value})"

  E_PACING:
    requires_metrics: [movement_range]
    conditions:
      - signal: horizontal_rate
        comparison: at_least
        threshold: 0.55
    min_duration_sec: 8.0
    merge_gap_sec: 2.0
    report:
      value: frame
      unit: "khung hình"
    label_template: "Di chuyển ngang liên tục {duration} giây (bắt đầu ở khung hình {value})"

  E_TURNED_AWAY:
    requires_metrics: [turned_away_ratio]
    conditions:
      - signal: turned_away
        comparison: at_least
        threshold: 0.5
    min_duration_sec: 5.0
    merge_gap_sec: 2.0
    report:
      value: frame
      unit: "khung hình"
    label_template: "Quay người khỏi hướng khán giả {duration} giây (bắt đầu ở khung hình {value})"

  E_CLOSED_POSTURE:
    requires_metrics: [closed_posture_ratio]
    conditions:
      - signal: closed_posture
        comparison: at_least
        threshold: 0.5
    min_duration_sec: 12.0
    merge_gap_sec: 2.0
    report:
      value: frame
      unit: "khung hình"
    label_template: "Khoanh tay hoặc tay để thấp liên tục {duration} giây (bắt đầu ở khung hình {value})"

  # Nhóm tích cực. Đây là VẮNG MẶT điểm yếu, không phải phát hiện điểm mạnh —
  # không đặt tên là "điểm mạnh" ở bất kỳ đâu trong giao diện lẫn tài liệu.
  E_STABLE_SEGMENT:
    requires_metrics:
      - head_up_ratio
      - postural_sway
      - movement_range
      - closed_posture_ratio
      - shoulder_tilt
      - turned_away_ratio
    conditions:
      - signal: head_up
        comparison: at_least
        threshold: 0.5
      - signal: turned_away
        comparison: below
        threshold: 0.5
      - signal: closed_posture
        comparison: below
        threshold: 0.5
      - signal: motion_rate
        comparison: at_most
        threshold: 0.45
      - signal: shoulder_tilt_deg
        comparison: at_most
        threshold: 9.0
    min_duration_sec: 20.0
    merge_gap_sec: 2.0
    report:
      value: frame
      unit: "khung hình"
    label_template: "Mọi chỉ số ổn định trong {duration} giây (bắt đầu ở khung hình {value})"
