# Hồ sơ bối cảnh: cá nhân tự luyện thuyết trình trước webcam.
#
# NGƯỠNG DƯỚI ĐÂY LÀ ĐIỂM KHỞI ĐẦU, CHƯA PHẢI HIỆU CHỈNH THẬT.
#
# Toàn bộ khối `events` chuyển nguyên từ `presentation_class.yaml` (hồ sơ lớp
# học cũ, đã hiệu chỉnh trên bối cảnh đứng xa camera) — dùng tạm vì cùng bộ
# chỉ số/sự kiện, đỡ phải bắt đầu từ số 0. Đây KHÔNG phải ngưỡng đã kiểm
# chứng cho bối cảnh ngồi gần webcam; Task 9 (đo độ chính xác trên 10 bản ghi
# `presentation_solo` thật, dùng `PeerNote` làm dữ liệu đối chứng) bắt buộc
# phải chạy trước khi tin số liệu này. Tăng `version` sau khi hiệu chỉnh lại.
#
# Khác biệt đã biết so với presentation_class, cần theo dõi khi hiệu chỉnh:
# người dùng thường ngồi và khung hình cắt ngang ngực, nên nhóm `hips` thường
# không nhìn thấy — các chỉ số dựa trên hông sẽ trả về `không đo được`, đúng
# như thiết kế (xem `analyzers/landmark_availability.py`), chứ không trả về 0.
# Ngưỡng thời lượng tối thiểu (`min_duration_sec`) copy nguyên từ bối cảnh
# đứng xa nên nhiều khả năng cần điều chỉnh khi có dữ liệu ngồi gần thật.
#
# Khác một chỗ so với presentation_class: mọi sự kiện ở đây báo khung hình
# bắt đầu sự kiện (`report.value: frame`) thay vì chỉ báo thời lượng -- vẫn
# giữ nguyên trong `PresentationEvent.measured_value`/`.unit` (bảng theo dõi
# chất lượng cần con số này). Nhãn hiển thị (`label_template`) thì KHÔNG còn
# nhắc lại số khung hình đó nữa: SessionReview.tsx tự ghép câu "Điểm đánh dấu
# lúc {start_sec}s: {label}" ngay trong giao diện, nên "(bắt đầu ở khung hình
# N)" trong chính nhãn chỉ là nhắc lại thông tin kỹ thuật đã có ở ngoài. Nhãn
# ở đây chỉ còn mô tả CHUYỆN GÌ xảy ra (kèm `{duration}` nếu là việc kéo dài
# thật, bỏ nếu là một khoảnh khắc tức thời) -- không phải "đoạn này là X".
# `presentation_class.yaml` (hồ sơ lớp học cũ) giữ nguyên kiểu báo cáo gốc,
# không đổi theo.

profile: presentation_solo
version: "0.1.0"
description: >-
  Người dùng tự ghi trước webcam. Camera gần, khung hình thường cắt ngang ngực.

frame_requirements:
  min_pose_detected_ratio: 0.5
  min_landmark_visibility: 0.5
  min_group_frame_ratio: 0.6
  min_sample_rate_hz: 1.0

# Tập chỉ số áp dụng. Giữ nguyên `required_landmark_groups` như hồ sơ lớp học:
# đây là ràng buộc hình học, không phải ngưỡng, nên không cần chờ hiệu chỉnh.
metrics:
  head_up_ratio:
    unit: "tỷ lệ 0-1"
    required_landmark_groups: [head, shoulders]
    params:
      head_up_margin_ratio: 0.35
      # Phương án dự phòng khi Pose không đo được: chỉ dùng head pose của Face
      # Mesh khi phát hiện được mặt rõ trong ít nhất tỷ lệ khung hình này.
      facemesh_fallback_min_faces_ratio: 0.6

  postural_sway:
    unit: "lần rộng vai"
    required_landmark_groups: [shoulders, hips]
    params: {}

  movement_range:
    unit: "lần rộng vai"
    required_landmark_groups: [shoulders, hips]
    params: {}

  gesture_rate:
    unit: "lần/phút"
    required_landmark_groups: [shoulders, hips, upper_body]
    params:
      gesture_elevation_ratio: 0.35
      gesture_lateral_ratio: 0.45

  closed_posture_ratio:
    unit: "tỷ lệ 0-1"
    required_landmark_groups: [shoulders, hips, upper_body]
    params:
      low_wrist_elevation_ratio: 0.05
      crossed_wrist_overlap_ratio: 0.10

  shoulder_tilt:
    unit: "độ"
    required_landmark_groups: [shoulders]
    params: {}

  turned_away_ratio:
    unit: "tỷ lệ 0-1"
    required_landmark_groups: [shoulders]
    params:
      turned_width_ratio: 0.62

  # Giọng nói (analyzers/voice_analyzer.py) -- không cần landmark nào cả,
  # nên `required_landmark_groups: []` luôn luôn thoả; "đo được" hay không
  # chỉ phụ thuộc việc video có trích được track âm thanh hay không (xem
  # extractors/audio_extractor.py).
  silence_ratio:
    unit: "tỷ lệ 0-1"
    required_landmark_groups: []
    params:
      silence_rms_floor: 0.01

  low_volume_ratio:
    unit: "tỷ lệ 0-1"
    required_landmark_groups: []
    params:
      low_volume_relative_threshold: 0.4

  filler_word_rate:
    unit: "lần/phút"
    required_landmark_groups: []
    params: {}

# Danh mục sự kiện đã khai báo.
event_catalog:
  - E_HEAD_DOWN
  - E_STATIC
  - E_PACING
  - E_TURNED_AWAY
  - E_CLOSED_POSTURE
  - E_GESTURE
  - E_HEAD_UP
  - E_POSTURAL_SWAY_SPIKE
  - E_LONG_SILENCE
  - E_LOW_VOLUME
  - E_FILLER_WORD

# ---------------------------------------------------------------------------
# Bộ ngưỡng — chuyển nguyên từ presentation_class, CHƯA hiệu chỉnh cho bối
# cảnh ngồi gần webcam. Xem ghi chú đầu file.
# ---------------------------------------------------------------------------
events:
  E_HEAD_DOWN:
    requires_metrics: [head_up_ratio]
    conditions:
      - signal: head_up
        comparison: below
        threshold: 0.5
    min_duration_sec: 4.0
    merge_gap_sec: 2.0
    report:
      value: frame
      unit: "khung hình"
    label_template: "Cúi mặt liên tục {duration} giây"

  E_STATIC:
    requires_metrics: [postural_sway, movement_range]
    conditions:
      - signal: motion_rate
        comparison: at_most
        threshold: 0.04
    min_duration_sec: 25.0
    merge_gap_sec: 2.0
    # value: frame -- báo khung hình bắt đầu sự kiện thay vì tỷ lệ chuẩn hoá
    # "lần rộng vai mỗi giây": số nguyên dễ định vị hơn số thập phân kỹ thuật.
    report:
      value: frame
      unit: "khung hình"
    label_template: "Không dịch chuyển trong {duration} giây"

  E_PACING:
    requires_metrics: [movement_range]
    conditions:
      - signal: horizontal_rate
        comparison: at_least
        threshold: 0.55
    min_duration_sec: 8.0
    merge_gap_sec: 2.0
    report:
      value: frame
      unit: "khung hình"
    label_template: "Di chuyển ngang liên tục {duration} giây"

  E_TURNED_AWAY:
    requires_metrics: [turned_away_ratio]
    conditions:
      - signal: turned_away
        comparison: at_least
        threshold: 0.5
    min_duration_sec: 5.0
    merge_gap_sec: 2.0
    report:
      value: frame
      unit: "khung hình"
    label_template: "Quay người khỏi hướng khán giả {duration} giây"

  E_CLOSED_POSTURE:
    requires_metrics: [closed_posture_ratio]
    conditions:
      - signal: closed_posture
        comparison: at_least
        threshold: 0.5
    min_duration_sec: 12.0
    merge_gap_sec: 2.0
    report:
      value: frame
      unit: "khung hình"
    label_template: "Khoanh tay hoặc tay để thấp liên tục {duration} giây"

  # ---------------------------------------------------------------------
  # Ba sự kiện đếm-số-lần bên dưới là MỚI, ngưỡng TẠM/CHƯA KIỂM CHỨNG (thêm
  # cùng đợt với cơ chế `trigger: edge` ở models/profiles.py + events/detector.py) —
  # chưa chạy qua Task 9 như phần còn lại của file. Nhu cầu: đếm được "ngẩng
  # đầu mấy lần" / "cử chỉ tay mấy lần" thay vì chỉ báo một tỷ lệ gộp cho cả
  # video, và báo "lắc lư tư thế trong bao nhiêu giây" tại đúng thời điểm xảy
  # ra thay vì chỉ một số RMS gộp cuối video.
  # ---------------------------------------------------------------------

  E_GESTURE:
    requires_metrics: [gesture_rate]
    conditions:
      - signal: gesture_active
        comparison: at_least
        threshold: 1.0
    trigger: edge
    min_duration_sec: 0.0
    # Gộp các lần bật/tắt cách nhau dưới 2 giây thành một cử chỉ, tránh đếm
    # trùng khi tay rung nhẹ ở ranh giới ngưỡng trong lúc đang giơ lên.
    merge_gap_sec: 2.0
    report:
      value: frame
      unit: "khung hình"
    label_template: "Cử chỉ tay"

  E_HEAD_UP:
    requires_metrics: [head_up_ratio]
    conditions:
      - signal: head_up
        comparison: at_least
        threshold: 0.5
    trigger: edge
    min_duration_sec: 0.0
    merge_gap_sec: 2.0
    report:
      value: frame
      unit: "khung hình"
    label_template: "Ngẩng đầu lên"

  # Khác E_GESTURE/E_HEAD_UP: đây vẫn là `trigger: sustained` (mặc định), vì
  # câu hỏi gốc là "lắc lư TRONG BAO NHIÊU GIÂY" — hướng thời lượng, không
  # phải đếm số lần. Ngưỡng 0.5 lần-rộng-vai và 3 giây đều là số tạm, chưa có
  # dữ liệu người ngồi gần webcam thật để đối chứng.
  E_POSTURAL_SWAY_SPIKE:
    requires_metrics: [postural_sway]
    conditions:
      - signal: postural_sway_dev
        comparison: at_least
        threshold: 0.5
    min_duration_sec: 3.0
    merge_gap_sec: 2.0
    report:
      value: frame
      unit: "khung hình"
    label_template: "Lắc lư tư thế trong {duration} giây"

  # ---------------------------------------------------------------------
  # Giọng nói (analyzers/voice_analyzer.py) -- ngưỡng TẠM/CHƯA KIỂM CHỨNG,
  # y hệt tinh thần 3 sự kiện ở trên. `voice_silent`/`voice_low_volume` chỉ
  # cần đo năng lượng âm thanh thô (luôn đo được nếu video có track âm
  # thanh); `filler_word_active` cần nhận dạng giọng nói (Whisper, tiếng
  # Việt, độ chính xác không cao) nên `E_FILLER_WORD` sẽ báo "không đo được"
  # bất cứ khi nào `self_practice_manager.py` không bật bước này (video quá
  # dài, nhận dạng lỗi...) -- không lặng lẽ báo 0 lần.
  # ---------------------------------------------------------------------

  E_LONG_SILENCE:
    requires_metrics: [silence_ratio]
    conditions:
      - signal: voice_silent
        comparison: at_least
        threshold: 1.0
    min_duration_sec: 3.0
    merge_gap_sec: 1.0
    report:
      value: frame
      unit: "khung hình"
    label_template: "Im lặng kéo dài {duration} giây"

  E_LOW_VOLUME:
    requires_metrics: [low_volume_ratio]
    conditions:
      - signal: voice_low_volume
        comparison: at_least
        threshold: 1.0
    min_duration_sec: 3.0
    merge_gap_sec: 1.0
    report:
      value: frame
      unit: "khung hình"
    label_template: "Nói nhỏ trong {duration} giây"

  E_FILLER_WORD:
    requires_metrics: [filler_word_rate]
    conditions:
      - signal: filler_word_active
        comparison: at_least
        threshold: 1.0
    trigger: edge
    min_duration_sec: 0.0
    # Cửa sổ đo là 0.5 giây (VoiceAnalyzer._WINDOW_SEC) nên 2 giây đủ để
    # không đếm trùng một từ đệm bị Whisper cắt thành 2 mốc thời gian sát
    # nhau, nhưng vẫn tách được 2 từ đệm nói cách nhau vài giây.
    merge_gap_sec: 2.0
    report:
      value: frame
      unit: "khung hình"
    label_template: "Dùng từ đệm"
